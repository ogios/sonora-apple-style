[package]
name = "service-runtime"
description = "Single-threaded service state and task scheduling without a windowing platform"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
futures.workspace = true
serde.workspace = true
tokio.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
oo7.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = { workspace = true, features = ["std", "CFData", "CFDictionary", "CFString", "CFNumber", "CFBase"] }
objc2-security.workspace = true
thiserror.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Security_Credentials"] }
